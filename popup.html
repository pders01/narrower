<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Narrower</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafaf8;
        --text: #282a27;
        --muted: #666a63;
        --line: #dedfd8;
        --accent: #496a50;
        --soft: #edf0e9;
        font: 13px/1.5 system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #20231f;
          --text: #eeeee7;
          --muted: #adb2a6;
          --line: #3e443b;
          --accent: #a8c29d;
          --soft: #2c3229;
        }
      }
      * { box-sizing: border-box; }
      body { width: 320px; margin: 0; padding: 22px; background: var(--bg); color: var(--text); }
      header, .site, .width-label, .scale, footer { display: flex; justify-content: space-between; align-items: center; }
      header { margin-bottom: 22px; }
      h1 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: -.4px; }
      .tagline { color: var(--muted); font-size: 11px; }
      .site { gap: 14px; padding-bottom: 18px; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
      .site-label { min-width: 0; }
      #hostname { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
      .hint, .scale { color: var(--muted); font-size: 11px; }
      .switch { position: relative; flex: 0 0 36px; height: 22px; }
      .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; }
      .track { display: block; height: 22px; border-radius: 20px; background: var(--line); pointer-events: none; }
      .track::before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; border-radius: 50%; background: var(--bg); }
      input:checked + .track { background: var(--accent); }
      input:checked + .track::before { transform: translateX(14px); }
      input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 3px; }
      input, button { accent-color: var(--accent); }
      input[type="range"] { display: block; width: 100%; margin: 14px 0 5px; cursor: pointer; }
      input:disabled, button:disabled { opacity: .45; cursor: default; }
      output { font-variant-numeric: tabular-nums; font-weight: 600; }
      #status { min-height: 39px; margin: 18px 0; padding: 10px 12px; border-radius: 6px; background: var(--soft); color: var(--muted); font-size: 12px; }
      #status[data-error="true"] { color: var(--text); }
      footer { padding-top: 14px; border-top: 1px solid var(--line); }
      button { font: inherit; color: var(--text); background: transparent; border: 1px solid var(--line); border-radius: 5px; padding: 5px 9px; cursor: pointer; }
      button:not(:disabled):hover { background: var(--soft); }
      button:focus-visible, input[type="range"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
      a { color: var(--muted); text-decoration: none; font-size: 11px; }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <header><h1>Narrower</h1><span class="tagline">A little room on either side.</span></header>
    <div class="site">
      <div class="site-label"><span id="hostname">This website</span><span class="hint">Remembered for this site only</span></div>
      <label class="switch" title="Enable Narrower for this site">
        <input type="checkbox" id="enableNarrower" aria-label="Enable Narrower for this site" disabled />
        <span class="track"></span>
      </label>
    </div>
    <div class="width-label"><label for="narrowerRange">Page width</label><output id="narrowerValue" for="narrowerRange">80%</output></div>
    <input type="range" id="narrowerRange" min="30" max="100" value="80" step="5" aria-describedby="widthHint" disabled />
    <div class="scale" id="widthHint"><span>Narrower</span><span>Original</span></div>
    <p id="status" role="status" aria-live="polite">Connecting to this page…</p>
    <footer>
      <button id="resetButton" type="button" disabled>Reset site</button>
      <a href="https://www.flaticon.com/free-icons/data-merge" target="_blank" rel="noopener noreferrer" title="Data merge icons created by Fuzzee — Flaticon">Icon credit ↗</a>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
